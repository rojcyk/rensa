description: Run the tests, then read-only reviews of the working tree against base by Claude, Grok and Codex.
steps:
  - id: test
    run: npm test
    on_fail: continue

  - id: review
    prompt: steps/review.md
    agents: [opus]
    vars:
      diff: $(git diff {{base}})
      test_output: steps.test.output
      test_passed: steps.test.passed

  - id: review-grok
    prompt: steps/review.md
    agents: [grok]
    vars:
      diff: $(git diff {{base}})
      test_output: steps.test.output
      test_passed: steps.test.passed

  - id: review-codex
    prompt: steps/review.md
    agents: [codex]
    vars:
      diff: $(git diff {{base}})
      test_output: steps.test.output
      test_passed: steps.test.passed
